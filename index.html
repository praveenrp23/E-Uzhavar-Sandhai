    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/farmer_logo.svg" />
    <meta name="description" content="Tamil Nadu Digital Farmers Market (E-Uzhavar Sandhai) connecting Consumers, Bulk Buyers, FPOs, and Logistics Partners." />
    <meta property="og:title" content="E-Uzhavar Sandhai" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('euzhavar_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f4f6f8] dark:bg-[#111215] text-slate-900 dark:text-zinc-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-700 dark:selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
